{{ define "main" }}

<article class="project-page">

  <h1>{{ .Title }}</h1>

  <p class="journal-date">
    {{ .Date.Format "2 Jan 2006" }}
  </p>

  {{ with .Params.status }}
    <p class="status">
      Status: {{ . }}
    </p>
  {{ end }}

  {{ with .Params.publication_url }}
  <p>
    Publication:
    <a href="{{ . }}" target="_blank" rel="noopener">
      {{ $.Params.publication_title }}
    </a>
  </p>
  {{ end }}

  <hr>

  {{ .Content }}

</article>

{{ end }}
