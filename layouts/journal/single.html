{{ define "main" }}

<article class="journal-note">

  <!-- NOTE TITLE -->
  <h1>{{ .Title }}</h1>

  <!-- DATE -->
  <p class="journal-date">
    {{ .Date.Format "2 Jan 2006" }}
  </p>

  <!-- PROJECT -->
  {{ with .Params.project }}
    <p class="journal-project">
      Project: {{ . }}
    </p>
  {{ end }}

  <hr>

  <!-- CONTENT -->
  {{ .Content }}

</article>

{{ end }}
