{{ define "main" }}

<article class="journal-note">

  <h1>{{ .Title }}</h1>

  <p class="journal-date">
    {{ .Date.Format "2 Jan 2006" }}
  </p>

  {{ with .Params.project }}
    <p class="journal-project">
      Project: {{ . }}
    </p>
  {{ end }}

  <hr>

  {{ .Content }}

</article>

{{ end }}
