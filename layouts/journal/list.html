{{ define "main" }}

<h1>Research Journal</h1>

{{ range .Pages.ByDate.Reverse }}

<article class="journal-card">

  <p class="card-meta">
    <a href="{{ .RelPermalink }}">
      {{ .Date.Format "2 January 2006" }}
    </a>
  </p>

  {{ with .Params.preview }}
    <p class="card-preview">
      {{ . }}
    </p>
  {{ end }}

</article>

{{ end }}

{{ end }}
