{{ define "main" }}

<!-- Publications -->

<section>

    <h1>{{ .Title }}</h1>

    <p class="descriptive mt-3">
        {{ .Params.description }}
    </p>

</section>

<section>

    <div class="stack">

        {{ range .Pages.ByDate.Reverse }}

        <p class="publication-citation">

            {{ .Params.authors }}
            ({{ .Params.year }}).

            <a class="inline-link" href="{{ .RelPermalink }}">

                <span class="publication-title">
                    {{ .Title }}.
                </span>

            </a>

            {{ .Params.venue }}
            {{ .Params.status }}.

        </p>

        {{ end }}

    </div>

</section>

{{ end }}
