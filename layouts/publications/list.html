{{ define "main" }}

<h1>Publications</h1>

{{ range .Pages.ByDate }}

<article class="publication-item">

  {{ with .Params.authors_year }}
  <p class="card-meta">{{ . }}</p>
  {{ end }}  

  <h2 class="card-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>

  {{ with .Params.venue }}
  <p class="card-meta">{{ . }}</p>
  {{ end }}

  {{ with .Params.status }}
  <p class="card-meta">Status: {{ . }}</p>
  {{ end }}

</article>

{{ end }}

{{ end }}
