{{ define "main" }}

<!-- Notes -->

<section>

    <h1>{{ .Title }}</h1>

    <p class="descriptive mt-3">
        {{ .Params.description }}
    </p>

</section>

<section>

    <div class="stack-block">

        {{ range .Pages.ByDate.Reverse }}

        <article class="block">

            <a class="inline-link" href="{{ .RelPermalink }}">
                <h3>{{ .Title }}</h3>
            </a>

            <p class="card-meta mt-2">
                {{ .Date.Format "2 January 2006" }}
            </p>

            {{ with .Params.preview }}
            <p class="card-preview mt-3">
                {{ . }}
            </p>
            {{ end }}

            <p class="card-meta mt-2">
                {{ .Params.project_title }}
            </p>

        </article>

        {{ end }}

    </div>

</section>

{{ end }}
